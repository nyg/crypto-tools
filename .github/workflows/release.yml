name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump type'
        required: true
        type: choice
        options:
          - patch
          - minor
          - major

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

# ──────────────────────────────────────────────────────────────────────────────
# Job 1: Bump version in package.json, commit, tag, push to master
# ──────────────────────────────────────────────────────────────────────────────
jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      release_version: ${{ steps.version.outputs.release }}
    steps:
      - name: Validate branch
        if: github.ref_name != 'master'
        run: |
          echo "::error::Releases must be created from the master branch (current: ${{ github.ref_name }})"
          exit 1

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN }}

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Bump version
        id: version
        run: |
          new_version=$(npm version ${{ inputs.bump }} --no-git-tag-version | sed 's/^v//')
          echo "release=$new_version" >> "$GITHUB_OUTPUT"
          echo "RELEASE_VERSION=$new_version" >> "$GITHUB_ENV"

      - name: Check tag does not already exist
        run: |
          if git show-ref --tags --verify --quiet "refs/tags/v${{ env.RELEASE_VERSION }}"; then
            echo "::error::Tag v${{ env.RELEASE_VERSION }} already exists"
            exit 1
          fi

      - name: Install git-cliff
        run: |
          gh release download --repo orhun/git-cliff --pattern 'git-cliff-*-x86_64-unknown-linux-gnu.tar.gz'
          tar xzf git-cliff-*-x86_64-unknown-linux-gnu.tar.gz --strip-components=1 --wildcards '*/git-cliff'
          sudo mv git-cliff /usr/local/bin/
          git cliff --version
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Update changelog
        run: git cliff --tag "v${{ env.RELEASE_VERSION }}" -o CHANGELOG.md

      - name: Commit and tag
        run: |
          git add package.json CHANGELOG.md
          git commit -m "chore(release): bump version to v${{ env.RELEASE_VERSION }}"
          git tag "v${{ env.RELEASE_VERSION }}"

      - name: Push
        run: |
          git push origin master
          git push origin "v${{ env.RELEASE_VERSION }}"

# ──────────────────────────────────────────────────────────────────────────────
# Job 2: Build Electrobun desktop artifacts on each native platform
# ──────────────────────────────────────────────────────────────────────────────
  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15        # arm64 (Apple Silicon)
            platform: macOS-arm64
          - os: windows-latest  # x64
            platform: Windows
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: v${{ needs.prepare.outputs.release_version }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Setup Hutch
        if: runner.os != 'Windows'
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -sSf https://hutch.blackboard.sh/hutch/install.sh -o install-hutch.sh
          sh install-hutch.sh --no-modify-path
          rm install-hutch.sh
          echo "$HOME/.dash/bin" >> "$GITHUB_PATH"

      - name: Setup Hutch (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Invoke-WebRequest -UseBasicParsing -Uri https://hutch.blackboard.sh/hutch/install.ps1 -OutFile install-hutch.ps1
          ./install-hutch.ps1
          Remove-Item install-hutch.ps1
          "$HOME\.dash\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Build desktop app
        run: hutch electrobun build --env=production

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist-${{ matrix.platform }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 1

# ──────────────────────────────────────────────────────────────────────────────
# Job 3: Assemble GitHub Release
# ──────────────────────────────────────────────────────────────────────────────
  release:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: v${{ needs.prepare.outputs.release_version }}
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
          merge-multiple: true

      # Electrobun names its artifacts after the channel, OS and arch; the release
      # assets instead say which OS and CPU they are for and which version they are,
      # so a download is unambiguous once it sits in a Downloads folder.
      - name: Rename release assets
        env:
          VERSION: ${{ needs.prepare.outputs.release_version }}
        run: |
          set -euo pipefail
          find artifacts -name '*.dmg' -exec mv {} "artifacts/crypto-tools-${VERSION}-macos-arm64.dmg" \;
          find artifacts -name '*.zip' -exec mv {} "artifacts/crypto-tools-${VERSION}-windows-x64-setup.zip" \;

      - name: Create Scoop ZIP
        env:
          VERSION: ${{ needs.prepare.outputs.release_version }}
        run: |
          set -euo pipefail
          mkdir -p _scoop_build
          # Scoop distributes a flat portable bundle and updates it via the
          # bucket manifest written below. This app currently does not set
          # release.baseUrl or call Electrobun.Updater, so Scoop installs do
          # not self-update. If a future channel enables Electrobun auto-update,
          # exclude the Scoop build from it or it will overwrite Scoop's
          # managed install directory.
          #
          # The Windows ZIP ships a self-extracting *-Setup.exe; the actual app
          # files are in .installer/*.tar.zst inside the same ZIP. Extract them
          # into a flat zip that Scoop can consume directly (bin\launcher.exe
          # at the root), so no Scoop installer script is required.
          unzip -q "artifacts/crypto-tools-${VERSION}-windows-x64-setup.zip" '.installer/*' -d _scoop_build
          mapfile -t tarballs < <(find _scoop_build/.installer -mindepth 1 -maxdepth 1 -type f -name '*.tar.zst' -print)
          if [ "${#tarballs[@]}" -ne 1 ]; then
            found='(none)'
            if [ "${#tarballs[@]}" -gt 0 ]; then
              found=$(printf '%s ' "${tarballs[@]}")
            fi
            echo "::error::Expected exactly one .tar.zst under _scoop_build/.installer, found: ${found}"
            exit 1
          fi
          zstd -d "${tarballs[0]}" -o _scoop_build/setup.tar
          tar -xf _scoop_build/setup.tar -C _scoop_build
          mapfile -t appdirs < <(find _scoop_build -mindepth 1 -maxdepth 1 -type d ! -name '.installer' -print)
          if [ "${#appdirs[@]}" -ne 1 ]; then
            found='(none)'
            if [ "${#appdirs[@]}" -gt 0 ]; then
              found=$(printf '%s ' "${appdirs[@]}")
            fi
            echo "::error::Expected exactly one app directory under _scoop_build, found: ${found}"
            exit 1
          fi
          if [ ! -f "${appdirs[0]}/bin/launcher.exe" ]; then
            echo "::error::bin/launcher.exe not found under ${appdirs[0]} — Electrobun layout may have changed"
            exit 1
          fi
          ( cd "${appdirs[0]}" && zip -r "$GITHUB_WORKSPACE/artifacts/crypto-tools-${VERSION}-windows-x64-scoop.zip" . )
          rm -rf _scoop_build

      - name: Create single-file installer EXE
        env:
          VERSION: ${{ needs.prepare.outputs.release_version }}
        run: |
          set -euo pipefail
          rm -rf _exe_build && mkdir -p _exe_build
          unzip -q "artifacts/crypto-tools-${VERSION}-windows-x64-setup.zip" -d _exe_build

          setup_exe=$(find _exe_build -maxdepth 1 -type f -name '*-Setup.exe' -print -quit)
          metadata=$(find _exe_build/.installer -maxdepth 1 -type f -name '*.metadata.json' -print -quit)
          payload=$(find _exe_build/.installer -maxdepth 1 -type f -name '*.tar.zst' -print -quit)

          for required in "$setup_exe" "$metadata" "$payload"; do
            if [ -z "$required" ]; then
              echo "::error::Windows installer ZIP is missing the exe, metadata or payload — Electrobun layout may have changed"
              exit 1
            fi
          done

          output="artifacts/crypto-tools-${VERSION}-windows-x64-setup.exe"
          {
            cat "$setup_exe"
            printf '%s' 'ELECTROBUN_METADATA_V1'
            cat "$metadata"
            printf '%s' 'ELECTROBUN_ARCHIVE_V1'
            cat "$payload"
          } > "$output"

          markers=$(grep -ao 'ELECTROBUN_METADATA_V1' "$output" | wc -l)
          if [ "$markers" -lt 2 ]; then
            echo "::error::Appended metadata marker not found in ${output}"
            exit 1
          fi

          lfanew=$(od -An -tu4 -j 60 -N 4 "$output" | tr -d ' ')
          subsystem=$(od -An -tu1 -j $((lfanew + 92)) -N 1 "$output" | tr -d ' ')
          if [ "$subsystem" != "2" ]; then
            echo "::error::Installer PE subsystem is ${subsystem}, expected 2 (GUI) — it would open a console window"
            exit 1
          fi

          ls -l "$output"
          rm -rf _exe_build

      - name: Generate release notes
        uses: orhun/git-cliff-action@f50e11560dce63f7c33227798f90b924471a88b5 # v4.8.0
        with:
          args: --latest --strip all

      - name: Append macOS install guidance to release notes
        run: |
          cat >> git-cliff/CHANGELOG.md <<'EOF'

          ## Installing on macOS

          The app is ad-hoc signed but **not notarized**, so macOS quarantines it after download and blocks the first launch (you may see *"Crypto Tools.app is damaged"* or *"Apple could not verify…"* — both mean the same thing; the app is not corrupted).

          **Easiest — Homebrew** (handles this automatically):

          ```sh
          brew install --cask nyg/tap/crypto-tools
          ```

          **Manual DMG** — after copying Crypto Tools.app to Applications, remove the quarantine flag once:

          ```sh
          xattr -dr com.apple.quarantine "/Applications/Crypto Tools.app"
          ```

          ## Installing on Windows

          **Easiest — Scoop** (no admin rights, no SmartScreen prompt):

          ```powershell
          scoop bucket add nyg https://github.com/nyg/scoop-bucket
          scoop install crypto-tools
          ```

          **Manual installer** — download the `…-windows-x64-setup.exe` asset and run it. The app installs per-user to `%LOCALAPPDATA%` (no admin rights needed) and finishes by putting a **Crypto Tools** shortcut on your Desktop and in the Start menu; there is no completion dialog, so that shortcut is how you know it worked. Because the app is not code-signed, SmartScreen shows *"Windows protected your PC"* — click **More info → Run anyway** (offered to administrators only). Installing via Scoop avoids this prompt entirely.

          The `…-windows-x64-setup.zip` asset is the same installer in Electrobun's original layout, kept for one release as a fallback.
          EOF

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.release_version }}
        run: |
          set -uo pipefail
          assets=(
            "artifacts/crypto-tools-${VERSION}-macos-arm64.dmg"
            "artifacts/crypto-tools-${VERSION}-windows-x64-setup.exe"
            "artifacts/crypto-tools-${VERSION}-windows-x64-setup.zip"
            "artifacts/crypto-tools-${VERSION}-windows-x64-scoop.zip"
          )

          for attempt in 1 2 3 4 5; do
            if gh release view "v${VERSION}" >/dev/null 2>&1; then
              echo "Release v${VERSION} already exists; uploading assets to it."
              if gh release upload "v${VERSION}" "${assets[@]}" --clobber; then
                exit 0
              fi
            elif gh release create "v${VERSION}" "${assets[@]}" \
                   --title "v${VERSION}" \
                   --verify-tag \
                   -F git-cliff/CHANGELOG.md; then
              exit 0
            fi

            if (( attempt < 5 )); then
              delay=$(( attempt * 15 ))
              echo "::warning::Release publication attempt ${attempt} failed, retrying in ${delay}s"
              sleep "$delay"
            fi
          done

          echo "::error::Could not publish release v${VERSION} after 5 attempts"
          exit 1

      - name: Compute DMG SHA256
        id: sha
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.release_version }}
        run: |
          set -euo pipefail
          gh release download "v${VERSION}" --repo nyg/crypto-tools \
            --pattern "crypto-tools-${VERSION}-macos-arm64.dmg" --output crypto-tools.dmg
          SHA256=$(sha256sum crypto-tools.dmg | awk '{print $1}')
          echo "dmg_sha256=$SHA256" >> "$GITHUB_OUTPUT"
          rm crypto-tools.dmg

      - name: Compute ZIP SHA256
        id: zip_sha
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.release_version }}
        run: |
          set -euo pipefail
          gh release download "v${VERSION}" --repo nyg/crypto-tools \
            --pattern "crypto-tools-${VERSION}-windows-x64-scoop.zip" --output crypto-tools-scoop.zip
          SHA256=$(sha256sum crypto-tools-scoop.zip | awk '{print $1}')
          echo "zip_sha256=$SHA256" >> "$GITHUB_OUTPUT"
          rm crypto-tools-scoop.zip

      - name: Trigger homebrew tap cask update
        uses: peter-evans/repository-dispatch@28959ce8df70de7be546dd1250a005dd32156697 # v4.0.1
        with:
          token: ${{ secrets.RELEASE_TOKEN }}
          repository: nyg/homebrew-tap
          event-type: update-crypto-tools-cask
          client-payload: >-
            {
              "version": "${{ needs.prepare.outputs.release_version }}",
              "dmg_sha256": "${{ steps.sha.outputs.dmg_sha256 }}"
            }

      - name: Update Scoop bucket manifest
        env:
          VERSION: ${{ needs.prepare.outputs.release_version }}
          ZIP_SHA256: ${{ steps.zip_sha.outputs.zip_sha256 }}
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          git clone "https://x-access-token:${RELEASE_TOKEN}@github.com/nyg/scoop-bucket.git" _scoop_bucket
          cd _scoop_bucket
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p bucket
          # bin is given an alias: the Electrobun entry point is always named
          # launcher.exe, so without one Scoop would shim it as `launcher` and every
          # Electrobun app in the bucket would fight over that same name.
          jq -n \
            --arg version "$VERSION" \
            --arg url "https://github.com/nyg/crypto-tools/releases/download/v${VERSION}/crypto-tools-${VERSION}-windows-x64-scoop.zip" \
            --arg hash "sha256:${ZIP_SHA256}" \
            '{
              version: $version,
              description: "A collection of cryptocurrency tools for Kraken and Binance exchanges.",
              homepage: "https://github.com/nyg/crypto-tools",
              license: "MIT",
              architecture: {
                "64bit": {url: $url, hash: $hash}
              },
              bin: [["bin\\launcher.exe", "crypto-tools"]],
              shortcuts: [["bin\\launcher.exe", "Crypto Tools"]]
            }' > bucket/crypto-tools.json
          git add bucket/crypto-tools.json
          git commit -m "chore: update crypto-tools to v${VERSION}"
          git push
