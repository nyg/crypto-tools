<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b3a55"/>
      <stop offset="1" stop-color="#0d1526"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.28" r="0.75">
      <stop offset="0" stop-color="#3d5378" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#3d5378" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="coin" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#fcd34d"/>
      <stop offset="0.55" stop-color="#f59e0b"/>
      <stop offset="1" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="coinEdge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fde68a"/>
      <stop offset="1" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="0.5" stop-color="#cbd5e1"/>
      <stop offset="1" stop-color="#8fa3bb"/>
    </linearGradient>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
    <filter id="wrenchShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- macOS squircle background -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#glow)"/>

  <!-- coin as hex nut -->
  <g filter="url(#softShadow)">
    <circle cx="445" cy="415" r="245" fill="url(#coinEdge)"/>
    <circle cx="445" cy="415" r="227" fill="url(#coin)"/>
    <!-- bitcoin symbol -->
    <g transform="translate(445,415)" fill="none" stroke="#0d1526" stroke-width="34" stroke-linecap="round" stroke-linejoin="round">
      <path d="M-55 -110 V 110"/>
      <path d="M-55 -110 H 5 A 51 51 0 0 1 5 -8 H -55"/>
      <path d="M-55 -8 H 12 A 59 59 0 0 1 12 110 H -55"/>
      <path d="M-18 -148 V -110"/>
      <path d="M28 -148 V -102"/>
      <path d="M-18 148 V 110"/>
      <path d="M28 148 V 104"/>
    </g>
  </g>

  <!-- wrench (lucide style), mirrored so handle runs to bottom-right -->
  <g filter="url(#wrenchShadow)">
    <g transform="translate(936,496) scale(-17,17)">
      <path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"
            fill="none" stroke="#0d1526" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"
            fill="url(#steel)" stroke="url(#steel)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>
</svg>
